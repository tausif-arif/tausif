<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Cyberpunk Universe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            color: #00ffff;
        }

        .portal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            perspective: 1000px;
        }

        .portal {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: rotatePortal 20s linear infinite;
            margin-top: 50px;
        }

        .portal-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.5);
            transform-style: preserve-3d;
        }

        .portal-ring:nth-child(1) { width: 100%; height: 100%; animation: pulse 2s ease-in-out infinite alternate; }
        .portal-ring:nth-child(2) { width: 80%; height: 80%; animation: pulse 2s ease-in-out infinite alternate 0.3s; }
        .portal-ring:nth-child(3) { width: 60%; height: 60%; animation: pulse 2s ease-in-out infinite alternate 0.6s; }
        .portal-ring:nth-child(4) { width: 40%; height: 40%; animation: pulse 2s ease-in-out infinite alternate 0.9s; }
        .portal-ring:nth-child(5) { width: 20%; height: 20%; animation: pulse 2s ease-in-out infinite alternate 1.2s; }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            animation: moveStars 60s linear infinite;
        }

        .lightning {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #00ffff, transparent);
            opacity: 0;
            animation: lightning 0.5s linear;
        }

        .choice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
            z-index: 10;
        }

        .glitch-text {
            font-size: 24px;
            text-shadow: 
                0.05em 0 0 rgba(255,0,0,.75),
                -0.025em -0.05em 0 rgba(0,255,0,.75),
                0.025em 0.05em 0 rgba(0,0,255,.75);
            animation: glitch 500ms infinite;
            margin-bottom: 20px;
        }

        .pill-container {
            display: flex;
            gap: 20px;
        }

        .pill {
            width: 100px;
            height: 40px;
            border: none;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pill:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px currentColor;
        }

        .pill.red {
            background-color: #ff0000;
        }

        .pill.blue {
            background-color: #0000ff;
        }

        @keyframes rotatePortal {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes moveStars {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 550px 550px, 350px 350px, 250px 250px; }
        }

        @keyframes lightning {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes glitch {
            0% {
                text-shadow: 
                    0.05em 0 0 rgba(255,0,0,.75),
                    -0.05em -0.025em 0 rgba(0,255,0,.75),
                    -0.025em 0.05em 0 rgba(0,0,255,.75);
            }
            14% {
                text-shadow: 
                    0.05em 0 0 rgba(255,0,0,.75),
                    -0.05em -0.025em 0 rgba(0,255,0,.75),
                    -0.025em 0.05em 0 rgba(0,0,255,.75);
            }
            15% {
                text-shadow: 
                    -0.05em -0.025em 0 rgba(255,0,0,.75),
                    0.025em 0.025em 0 rgba(0,255,0,.75),
                    -0.05em -0.05em 0 rgba(0,0,255,.75);
            }
            49% {
                text-shadow: 
                    -0.05em -0.025em 0 rgba(255,0,0,.75),
                    0.025em 0.025em 0 rgba(0,255,0,.75),
                    -0.05em -0.05em 0 rgba(0,0,255,.75);
            }
            50% {
                text-shadow: 
                    0.025em 0.05em 0 rgba(255,0,0,.75),
                    0.05em 0 0 rgba(0,255,0,.75),
                    0 -0.05em 0 rgba(0,0,255,.75);
            }
            99% {
                text-shadow: 
                    0.025em 0.05em 0 rgba(255,0,0,.75),
                    0.05em 0 0 rgba(0,255,0,.75),
                    0 -0.05em 0 rgba(0,0,255,.75);
            }
            100% {
                text-shadow: 
                    -0.025em 0 0 rgba(255,0,0,.75),
                    -0.025em -0.025em 0 rgba(0,255,0,.75),
                    -0.025em -0.05em 0 rgba(0,0,255,.75);
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="portal">
            <div class="portal-ring"></div>
            <div class="portal-ring"></div>
            <div class="portal-ring"></div>
            <div class="portal-ring"></div>
            <div class="portal-ring"></div>
        </div>
        <div class="choice-container">
            <div class="glitch-text">Choose Your Reality</div>
            <div class="pill-container">
                <button class="pill red">Red</button>
                <button class="pill blue">Blue</button>
            </div>
        </div>
        <div class="stars"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const portal = document.querySelector('.portal');
            const portalRings = document.querySelectorAll('.portal-ring');
            const redPill = document.querySelector('.pill.red');
            const bluePill = document.querySelector('.pill.blue');

            function updatePortalEffect(e) {
                const x = e.clientX / window.innerWidth - 0.5;
                const y = e.clientY / window.innerHeight - 0.5;

                portal.style.transform = `rotateY(${x * 30}deg) rotateX(${-y * 30}deg)`;

                portalRings.forEach((ring, index) => {
                    const factor = (index + 1) * 0.1;
                    ring.style.transform = `translateZ(${-50 * factor}px) rotateX(${y * 60 * factor}deg) rotateY(${-x * 60 * factor}deg)`;
                });
            }

            document.addEventListener('mousemove', updatePortalEffect);

            function createLightning() {
                const lightning = document.createElement('div');
                lightning.classList.add('lightning');
                lightning.style.left = `${Math.random() * 100}%`;
                lightning.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                document.body.appendChild(lightning);

                setTimeout(() => {
                    lightning.remove();
                }, 1000);
            }

            setInterval(createLightning, 3000);

            function enterPortal(color) {
                document.body.style.transition = 'all 2s';
                document.body.style.filter = `hue-rotate(${color === 'red' ? '0deg' : '240deg'})`;
                document.body.style.opacity = 0;
                setTimeout(() => {
                    window.location.href = 'index.html';  // Replace with your actual portfolio URL
                }, 2000);
            }

            redPill.addEventListener('click', () => enterPortal('red'));
            bluePill.addEventListener('click', () => enterPortal('blue'));
        });
    </script>
</body>
</html>
