<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./assets/css/style.css" rel="stylesheet" />
    <title>Cosmic Portal Universe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            perspective: 1000px;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            gap: 50px;
        }

        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 250%;
            height: 250%;
            pointer-events: none;
            opacity: 0.2;
            z-index: 1;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .portal-container {
            position: relative;
            width: 20rem;
            height: 20rem;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
            margin-top: 10rem;
        }

        .portal-container:hover {
            transform: scale(1.1);
        }

        .portal-container:hover .portal-effect {
            animation: portalBreathFast 2s infinite ease-in-out;
        }

        .portal-container:hover .energy-rings div {
            animation-duration: 2s;
        }

        .portal {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .portal-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: portalSpin 8s linear infinite;
        }

        .portal-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow:
                inset 0 0 50px #0ff,
                0 0 50px #0ff;
            animation: portalPulse 2s infinite;
        }

        .portal-effect {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle,
                    rgba(0, 255, 255, 0.2) 0%,
                    rgba(0, 0, 255, 0.1) 30%,
                    transparent 70%);
            animation: portalBreath 4s infinite ease-in-out;
        }

        @keyframes portalBreathFast {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .energy-rings div {
            position: absolute;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: energyRing 3s infinite;
        }

        .energy-rings div:nth-child(1) {
            width: 90%;
            height: 90%;
            animation-delay: 0s;
        }

        .energy-rings div:nth-child(2) {
            width: 70%;
            height: 70%;
            animation-delay: -1s;
        }

        .energy-rings div:nth-child(3) {
            width: 50%;
            height: 50%;
            animation-delay: -2s;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: auto;
            margin-bottom: 50px;
            z-index: 2;
        }

        .welcome-text {
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px #0ff;
            animation: textPulse 2s infinite;
        }

        .choice-container {
            display: flex;
            gap: 40px;
        }

        .pill {
            width: 120px;
            height: 45px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .red-pill {
            background: linear-gradient(45deg, #ff0000, #990000);
            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .blue-pill {
            background: linear-gradient(45deg, #0066ff, #003399);
            box-shadow:
                0 0 20px rgba(0, 102, 255, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .pill:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .pill::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .pill:hover::after {
            left: 100%;
        }

        @keyframes energyRing {
            0% {
                transform: scale(0.8) rotate(0deg);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes portalSpin {
            0% {
                transform: rotate(0deg) scale(0.95);
            }

            50% {
                transform: rotate(180deg) scale(1.05);
            }

            100% {
                transform: rotate(360deg) scale(0.95);
            }
        }

        @keyframes portalBreath {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes textPulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .gif-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
        }

        .gif-overlay-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            animation: gif-fadeIn 1s ease-in-out;
            clip-path: circle(150% at 50% 50%);
            /* Increased to 150% to cover the entire screen */
        }

        @keyframes gif-fadeIn {
            from {
                opacity: 0;
                clip-path: circle(0% at 50% 50%);
            }

            to {
                opacity: 1;
                clip-path: circle(150% at 50% 50%);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas class="stars"></canvas>
        <canvas class="matrix-rain"></canvas>

        <div class="portal-container">
            <div class="portal">
                <div class="portal-effect"></div>
                <div class="portal-ring"></div>
                <div class="energy-rings">
                    <!-- <div></div>
                    <div></div>
                    <div></div> -->

                </div>
            </div>
        </div>

        <div class="content-container">
            <div class="welcome-text">
                Choose Your Reality
            </div>

            <div class="choice-container">
                <div class="pill red-pill" onclick="choosePill('red')">RED</div>
                <div class="pill blue-pill" onclick="choosePill('blue')">BLUE</div>
            </div>
        </div>
    </div>

    <script>
        // Matrix rain effect
        const canvas = document.querySelector('.matrix-rain');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = characters[Math.floor(Math.random() * characters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Cosmic particles effect
        const starsCanvas = document.querySelector('.stars');
        const starsCtx = starsCanvas.getContext('2d');

        starsCanvas.width = window.innerWidth;
        starsCanvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 200;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * starsCanvas.width;
                this.y = Math.random() * starsCanvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5;
                this.brightness = Math.random();
            }

            update() {
                this.y -= this.speed;
                if (this.y < 0) {
                    this.reset();
                    this.y = starsCanvas.height;
                }
            }

            draw() {
                starsCtx.beginPath();
                starsCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                starsCtx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
                starsCtx.fill();
            }
        }

        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animateParticles);
        }

        function animate() {
            drawMatrix();
            requestAnimationFrame(animate);
        }

        animate();
        animateParticles();

        // Portal entry effect
        function choosePill(color) {
            const portal = document.querySelector('.portal');
            const container = document.querySelector('.container');

            container.style.animation = 'portalEntry 2s forwards';
            document.body.style.transition = 'all 2s';
            document.body.style.filter = `hue-rotate(${color === 'red' ? '340deg' : '340deg'})`;
            document.body.style.opacity = 0;

            // Create and show the GIF overlay
            const overlay = document.createElement('div');
            overlay.classList.add('gif-overlay');
            document.body.appendChild(overlay);

            // Set up a GIF background for the overlay
            const gif = document.createElement('img');
            gif.src = 'https://media.giphy.com/media/3ohhwEZqxzKbNUHzji/giphy.gif';  // Updated GIF URL
            gif.classList.add('gif-overlay-img');
            overlay.appendChild(gif);
            setTimeout(() => {
                if (color === 'red') {
                    window.location.href = 'main.html';
                } else {
                    window.location.href = 'main.html';
                }
            }, 2000);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
